name: Windows check

on:
  push:
    branches: [study-1, audio-8, audio-5, audio-4, windows-port, agenda-studio, studio-in-agenda, mood-sync, home-rework, polish-2, cuffie, fixes-3, fixes-4, win-restyle, glass-ring, ring-solid, dock-merge, home-glass, glass-all, fixes-6, win-corpo, win-fit, fit-6]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Build
        working-directory: windows
        run: dotnet build Ponte.csproj -c Release -r win-x64 -p:Platform=x64
        shell: pwsh
