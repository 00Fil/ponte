name: Windows check

on:
  push:
    branches: [windows-port]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Build
        working-directory: windows
        run: dotnet build Ponte.csproj -c Release -r win-x64 -p:Platform=x64 -warnaserror- 2>&1 | Tee-Object build.log; if ($LASTEXITCODE -ne 0) { exit 1 }
        shell: pwsh
