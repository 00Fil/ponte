name: Windows check

on:
  push:
    branches: [windows-port, agenda-studio, studio-in-agenda, mood-sync, home-rework, polish-2, cuffie, fixes-3]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: 8.0.x }
      - name: Build
        working-directory: windows
        run: dotnet build Ponte.csproj -c Release -r win-x64 -p:Platform=x64
        shell: pwsh
