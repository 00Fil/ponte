name: Android check

on:
  push:
    branches: [agenda-studio, studio-in-agenda, mood-sync, home-rework, polish-2, cuffie, fixes-3, fixes-4, win-restyle, glass-ring, ring-solid, dock-merge, busy-glow, busy-glow-2, busy-glow-3, home-3, home-glass, home-quiet, agenda-carousel, dock-merge-2, agenda-perf, glass-all, flat-cards, fixes-5, fixes-6, cams-1, cams-2, cams-3, cams-4, cams-5, cams-6, lock-1, auto-1, auto-2, auto-3, auto-4, auto-5, home-dots, audio-2, audio-3, audio-4, audio-5, audio-6, audio-7, audio-8, audio-9, audio-10, audio-11, study-1, study-2, body-1, fit-1, fit-2, fit-3, piano-1, fit-4, fit-5]

jobs:
  android:
    runs-on: ubuntu-latest
    environment: SpacePonte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compila
        working-directory: android
        run: gradle assembleDebug --no-daemon
