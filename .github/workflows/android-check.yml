name: Android check

on:
  push:
    branches: [agenda-studio, studio-in-agenda, mood-sync, home-rework, polish-2, cuffie, fixes-3, fixes-4, win-restyle, glass-ring, ring-solid]

jobs:
  android:
    runs-on: ubuntu-latest
    environment: SpacePonte
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Licenze Android SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.9 }
      - name: Compila
        working-directory: android
        run: gradle assembleDebug --no-daemon
